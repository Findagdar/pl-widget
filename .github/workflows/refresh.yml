name: Refresh PL widget data

on:
  schedule:
    # Every 2 days at 06:00 UTC. Cron can't express "every N days" directly,
    # so this runs daily and the script itself is idempotent — cheap to run
    # more often than needed. If you want it to *literally* skip alternate
    # days, add a date-parity check at the top of fetch_data.py instead.
    - cron: "0 6 */2 * *"
  workflow_dispatch: {}   # lets you trigger a refresh manually from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4 pandas lxml

      - run: python scripts/fetch_data.py

      - name: Commit updated data.json
        run: |
          git config user.name "pl-widget-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "chore: refresh PL widget data"
          git push
